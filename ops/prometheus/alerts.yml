# Visible in Prometheus (Status → Alerts). No Alertmanager: notifications are out of scope.
groups:
  - name: llmgw
    rules:
      - alert: LedgerViolations
        expr: llmgw_ledger_violations > 0
        labels: {severity: page}
        annotations:
          summary: check_ledger found {{ $value }} problem(s); run `llmgw check-ledger` for the list

      - alert: SyncHoldStuck
        # Hold TTL (900 s) plus a minute: the sweeper should have expired it.
        expr: llmgw_hold_oldest_open_seconds{kind="sync"} > 960
        for: 2m
        labels: {severity: page}
        annotations:
          summary: a synchronous hold has been open {{ $value | humanizeDuration }}; is the sweeper running?

      - alert: HoldCloseFailures
        expr: increase(llmgw_hold_close_failures_total[5m]) > 0
        labels: {severity: warn}
        annotations:
          summary: hold closes are failing and being left to the sweeper

      - alert: DeadLetters
        # A gauge, so delta, not increase.
        expr: delta(llmgw_jobs{state="dead"}[15m]) > 0
        labels: {severity: warn}
        annotations:
          summary: jobs were dead-lettered in the last 15 minutes

      - alert: JobBacklogOld
        expr: llmgw_job_oldest_ready_seconds > 300
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: the oldest ready job has waited {{ $value | humanizeDuration }}

      - alert: EventLoopLag
        expr: histogram_quantile(0.99, sum by (job, instance, le) (rate(llmgw_event_loop_lag_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: '{{ $labels.job }} {{ $labels.instance }}: event-loop lag p99 above 100 ms'

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: '{{ $labels.job }} {{ $labels.instance }} is not answering scrapes'
