[project]
name = "llmgw"
version = "0.1.0"
description = "LLM gateway with a double-entry credit ledger and a Postgres-backed job queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.16.0",
    "asyncpg>=0.30",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "prometheus-client>=0.26.0",
    "redis>=5",
    "starlette>=1.10.0",
    "structlog>=24.4",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

[project.scripts]
llmgw = "llmgw.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "testcontainers[redis]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
